[package]
name = "ra"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local reviewer-driven coding agent for OpenAI-compatible endpoints"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
ratio-engine = { path = "../ratio-engine" }
ratio-protocol = { path = "../ratio-protocol" }
ring = "0.17"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
