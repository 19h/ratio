# Set RATIO_API_KEY to your MorphLLM credential before starting a run.
endpoint = "https://api.morphllm.com/v1"
model = "morph-dsv41flash-abliterated"
context_window = 1048576
output_tokens = 32000

[orchestration]
allow_inspection_shell = true

[mcp_servers.assist]
# Resolve Assist through PATH, or set the executable path in a local profile.
command = "assist"
args = ["--mcp"]
protocol = "2025-11-25"
lifetime = "worker"
allow_all = true
instructions = "Use tool_search to inspect Assist tool schemas. For unloaded binaries, call file_load_facts via mcp_call with an absolute arguments.path. For open IDA databases, use the matching list_databases hash as arguments.target for get_binary_type, get_segments, get_imports or list_functions. For managed instances, use list_instances then instance_info. Use read_file for raw bytes."
# Also available to agents during inspection phases, including before plan ACK.
inspection_tools = [
    "file_load_facts",
    "list_instances",
    "list_databases",
    "instance_info",
    "get_binary_type",
    "get_segments",
    "get_imports",
    "list_functions",
    "get_function_info",
]
