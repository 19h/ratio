# Set RATIO_API_KEY to your MorphLLM credential before starting a run.
endpoint = "https://api.morphllm.com/v1"
model = "morph-dsv41flash-abliterated"
context_window = 1048576
output_tokens = 32000

[orchestration]
allow_inspection_shell = true

[constraints]
# Route the second worker's process operations through MCP.
forbidden_tools = ["worker_2/shell"]

[mcp_servers.assist]
# Resolve Assist through PATH, or set the executable path in a local profile.
command = "assist"
args = ["--mcp"]
protocol = "2025-11-25"
lifetime = "worker"
allow_all = true
instructions = """
Plan and execute IDA lifecycle through Assist MCP, including when a saved plan specifies a CLI harness. In Work, fetch schemas with tool_search and use mcp_call for launch_instance, instance_info, save_instance, and terminate_instance. Launch with wait_seconds=0, check status directly, and do other work while analysis runs. Manage only instances you launch. Do not write, start, or poll shell-based IDA runners. Report MCP lifecycle failures as blockers.
For unloaded binaries use file_load_facts with an absolute path. Use list_databases hashes as targets for open databases and list_instances to discover managed instances. Use read_file for raw bytes.
"""
# Also available to agents during inspection phases, including before plan ACK.
inspection_tools = [
    "file_load_facts",
    "list_instances",
    "list_databases",
    "instance_info",
    "get_binary_type",
    "get_segments",
    "get_imports",
    "list_functions",
    "get_function_info",
]
