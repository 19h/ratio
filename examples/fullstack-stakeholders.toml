goal = "Implement and verify the application's account settings flow."
endpoint = "http://localhost:8000/v1"
model = "replace-with-provider-model"
context_window = 32768

[orchestration]
parallel_stakeholders = true
max_parallel_agents = 8

[[reviewers]]
name = "Application reviewer"
persona = "Check that state changes are validated and that failure cases preserve existing settings."
phases = ["planning", "review"]

[[stakeholders]]
name = "UX reviewer"
persona = "Check that the form supports keyboard navigation and gives clear feedback after submission."
phases = ["review"]

