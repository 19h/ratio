goal = "Fix the failing workspace tests and explain the changes."
# cwd = "/path/to/workspace"

endpoint = "https://api.openai.com/v1"
model = "replace-with-provider-model"
context_window = 32768
# Set RATIO_API_KEY or OPENAI_API_KEY in the environment.
# output_tokens = 4096
# legacy_max_tokens = false

# [worker]
# model = "worker-model"

# [reviewer]
# model = "reviewer-model"

[orchestration]
max_review_cycles = 3
max_plan_attempts = 3
max_requests = 512
max_total_tokens = 8000000
max_run_secs = 3600
max_tool_rounds = 100
request_timeout_secs = 180
command_timeout_secs = 120
parallel_stakeholders = true

[constraints]
required_tools = ["cargo test"]
custom_rules = ["Preserve public behavior unrelated to the reported failures."]
