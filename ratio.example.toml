goal = "Fix the failing workspace tests and explain the changes."
# cwd = "/path/to/workspace"

endpoint = "https://api.openai.com/v1"
model = "replace-with-provider-model"
context_window = 32768
# Set RATIO_API_KEY or OPENAI_API_KEY in the environment.
# output_tokens = 4096
# legacy_max_tokens = false

# [provider]
# stream = true
# stream_usage = true
# temperature = 0.2
# top_p = 0.9
# seed = 42
# parallel_tool_calls = false
# reasoning_effort = "medium"
#
# [provider.headers]
# x-provider-project = "project-id"

# [worker]
# model = "worker-model"

# [reviewer]
# model = "reviewer-model"

[orchestration]
# Optional limits. Omit a setting or use 0 for unlimited.
# max_review_cycles = 3
# max_plan_attempts = 3
# max_requests = 512
# max_total_tokens = 8000000
# max_run_secs = 3600
# max_tool_rounds = 100
request_timeout_secs = 180
command_timeout_secs = 120
parallel_stakeholders = true
# Checks Ratio runs after the work phase. A failure blocks approval.
# verification_commands = ["cargo test --locked --workspace"]
# Repository files added to every agent prompt. Loaded by default.
# project_instructions = true
# instruction_files = ["AGENTS.md", "CLAUDE.md", "CONTRIBUTING.md"]

[constraints]
required_tools = ["cargo test"]
custom_rules = ["Preserve public behavior unrelated to the reported failures."]
